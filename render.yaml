# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service: Express serves the API (/api) and the built React app.
services:
  - type: web
    name: glossia
    runtime: node
    plan: free
    buildCommand: >-
      cd client && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --omit=dev
    # Migrations are idempotent, so running them on every start is safe.
    startCommand: cd server && npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Managed MySQL (e.g. Aiven) — fill these in on the Render dashboard
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      # Optional: Google sign-in
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
