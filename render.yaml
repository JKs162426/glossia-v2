# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service: Express serves the API (/api) and the built React app.
services:
  - type: web
    name: glossia-v2
    runtime: node
    plan: free
    buildCommand: >-
      cd client && npm ci --include=dev && npm run build &&
      cd ../server && npm ci --omit=dev
    # Migrations are idempotent, so running them on every start is safe.
    startCommand: cd server && npm run migrate && npm start
    healthCheckPath: /api/health
    # Deploy a commit on main only after its GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      # Render puts 3 proxies in front of the app (verified 2026-10-25), so
      # req.ip — and the rate limiter — see the real visitor IP.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      # Managed MySQL (e.g. Aiven) — fill these in on the Render dashboard
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      # Optional: Google sign-in
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email via Brevo SMTP — required: the API won't start without them.
      # SMTP_USER is Brevo's SMTP login, SMTP_PASS an SMTP key, MAIL_FROM a
      # sender verified in Brevo, e.g. "Glossia <you@example.com>".
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
